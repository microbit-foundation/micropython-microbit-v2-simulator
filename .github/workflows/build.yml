name: build

on:
  release:
    types: [created]
  push:
    branches:
      - "**"

# This is conservative: ideally we'd include branch and stage in this key
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency: deploy-python-simulator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: eu-west-1

    steps:
      # Note: This workflow will not run on forks without modification; we're open to making steps
      #       that rely on our deployment infrastructure conditional. Please open an issue.
      - uses: actions/checkout@v4
      - name: Configure node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"
      - run: npm ci
      - run: node ./bin/print-ci-env.js >> $GITHUB_ENV
      - uses: microbit-foundation/npm-package-versioner-action@v3
      - run: ./ci-build.sh
      # The buckets, distributions and roles are in
      # microbit-foundation/microbit-org's apps/simulator. Only main and
      # release tags can assume the role for staging and releases.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::700731169244:role/github-actions-deploy-simulator-content${{ env.STAGE != 'REVIEW' && '-release' || '' }}
          aws-region: eu-west-1
      - run: npm run deploy
        env:
          # Set to 1 for one deploy after changing params in deployment.js,
          # as unchanged files are otherwise skipped.
          WEBSITE_DEPLOY_FORCE: 0
      - run: npm run invalidate
