name: build

on:
  release:
    types: [created]
  push:
    branches:
      - "**"

# This is conservative: ideally we'd include branch and stage in this key
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency: deploy-python-simulator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: eu-west-1

    steps:
      # Note: This workflow will not run on forks without modification; we're open to making steps
      #       that rely on our deployment infrastructure conditional. Please open an issue.
      - uses: actions/checkout@v7
      - name: Configure node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
      - run: npm ci
      - run: node ./bin/print-ci-env.js >> $GITHUB_ENV
      - uses: microbit-foundation/npm-package-versioner-action@v3
      - id: build
        run: ./ci-build.sh
      - name: Run Playwright tests
        timeout-minutes: 10
        uses: docker://mcr.microsoft.com/playwright:v1.64.1-noble
        with:
          args: npx playwright test
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
      # Review deploys even when tests fail, but not when the build does. The
      # buckets, distributions and roles are in microbit-foundation/
      # microbit-org's apps/simulator. Only main and release tags can assume
      # the role for staging and releases.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.build.outcome == 'success' && (env.STAGE == 'REVIEW' && !cancelled() || success())
        with:
          role-to-assume: arn:aws:iam::700731169244:role/github-actions-deploy-simulator-content${{ env.STAGE != 'REVIEW' && '-release' || '' }}
          aws-region: eu-west-1
      - run: npm run deploy
        if: steps.build.outcome == 'success' && (env.STAGE == 'REVIEW' && !cancelled() || success())
        env:
          # Set to 1 for one deploy after changing params in deployment.js,
          # as unchanged files are otherwise skipped.
          WEBSITE_DEPLOY_FORCE: 0
      - run: npm run invalidate
        if: steps.build.outcome == 'success' && (env.STAGE == 'REVIEW' && !cancelled() || success())
